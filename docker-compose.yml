# Docker Compose — StackForge infraestructura local
# Postgres + MinIO (storage S3-compatible para proyectos subidos).

# Variables usadas por compose (editar o sobreescribir con un .env en la raíz)
# POSTGRES_USER=stackforge
# POSTGRES_PASSWORD=stackforge
# POSTGRES_DB=stackforge
# MINIO_ROOT_USER=stackforge
# MINIO_ROOT_PASSWORD=stackforge-secret

services:
  postgres:
    image: postgres:17-alpine
    container_name: stackforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackforge}
      POSTGRES_DB: ${POSTGRES_DB:-stackforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stackforge} -d ${POSTGRES_DB:-stackforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: stackforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stackforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stackforge-secret}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket donde se almacenarán los proyectos subidos
  minio-init:
    image: minio/mc:latest
    container_name: stackforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-stackforge} ${MINIO_ROOT_PASSWORD:-stackforge-secret}; do sleep 2; done;
      /usr/bin/mc mb -p local/submissions || true;
      /usr/bin/mc mb -p local/temp || true;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data: