name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate (api)
        if: matrix.workspace == 'api'
        working-directory: apps/api
        run: npx prisma generate

      - name: Validate Prisma schema (api)
        if: matrix.workspace == 'api'
        working-directory: apps/api
        run: npx prisma validate

      - name: Lint
        run: npm run lint --workspace @stackforge/${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --workspace @stackforge/${{ matrix.workspace }}

      - name: Test
        run: npm run test --workspace @stackforge/${{ matrix.workspace }}

      - name: Build
        run: npm run build --workspace @stackforge/${{ matrix.workspace }}